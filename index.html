
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Registration</h1>
        <form id="userForm">
            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Register</button>
        </form>

        <h2>Registered users</h2>

        <div id="usersList"></div>
        <h3>In fact, that is only a json list, that has information, that you gave in form</h3>
    </main>

    <script src="script.js"></script>
</body>
</html>
